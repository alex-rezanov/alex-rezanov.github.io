<mat-sidenav-container>
  <mat-sidenav-content>
    @let isMobileUa = isMobile();
    <div class="section-container" [class.mobile]="isMobileUa">
      <app-side-bar class="side-bar" [class.mobile]="isMobileUa" />
      <router-outlet />
    </div>
    <footer [id]="homeSection.FOOTER">
      <app-footer />
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
