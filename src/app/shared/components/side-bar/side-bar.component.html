@if (!isSidebarEmpty()) {
  <!-- Single source of truth for nav items -->
  <ng-template #navItems>
    <div class="navigation-container">
      @for (item of sideBarItems(); track $index) {
        <div
          class="navigation-item"
          [class.active]="activeLink() === item.link"
          (click)="onNavClick($event, item.link)">
          {{ item.label }}
        </div>
      }
    </div>
  </ng-template>

  <!-- Mobile-only top bar: header row + expandable nav below -->
  <div class="mobile-bar" [class.menu-open]="isMenuOpen()">
    <div class="mobile-bar-header" (click)="onBackToHomeClick()">
      <div class="mobile-title">
        <span class="side-bar-title">{{ alexDetails.name }}</span>
        <span class="side-bar-title">{{ alexDetails.surname }}</span>
      </div>
      <button
        mat-icon-button
        class="burger-button"
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu">
        <mat-icon>{{ isMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
    <ng-container [ngTemplateOutlet]="navItems" />
  </div>

  <!-- Desktop sidebar only -->
  <div class="side-bar-container" [class.hidden]="isFooterActive()">
    @if (isNameVisible()) {
      <div class="side-bar-title-container" (click)="onScrollToTop()">
        <span class="side-bar-title">{{ alexDetails.name }}</span>
        <span class="side-bar-title">{{ alexDetails.surname }}</span>
      </div>
    }
    <ng-container [ngTemplateOutlet]="navItems" />
  </div>
}
